name: Repair SKU audit test scope

on:
  push:
    branches:
      - agent/fix-sku-audit-test-scope

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sku-audit-test-scope
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scope SKU read-only assertions to SKU audit code
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("kea-growth-ops/tests/static-check.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''assert.ok(!allSource.includes("write_products"), "SKU audit must stay read-only");
          assert.ok(
            !allSource.includes("productVariantsBulkUpdate"),
            "SKU audit must not update Shopify variants",
          );'''
          new = '''const skuReadOnlySource = [
            fs.readFileSync(path.join(root, "Collectors.gs"), "utf8"),
            fs.readFileSync(path.join(root, "ShopifySkuHealth.gs"), "utf8"),
          ].join("\\n");
          assert.ok(
            !skuReadOnlySource.includes("write_products"),
            "SKU audit must stay read-only",
          );
          assert.ok(
            !skuReadOnlySource.includes("productVariantsBulkUpdate"),
            "SKU audit must not update Shopify variants",
          );'''
          if text.count(old) != 1:
              raise SystemExit("expected SKU read-only assertion block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run all Growth Ops tests
        run: |
          node kea-growth-ops/tests/static-check.mjs
          node kea-growth-ops/tests/sale-bulk-check.mjs
      - name: Commit repaired test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-sku-audit-test-scope.yml
          git add kea-growth-ops/tests/static-check.mjs
          git commit -m "Scope SKU read-only test to audit code"
          git push origin HEAD:agent/fix-sku-audit-test-scope
