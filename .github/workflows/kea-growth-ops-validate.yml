name: Validate Kea Growth Ops

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static and syntax checks
        run: |
          node kea-growth-ops/tests/static-check.mjs
          node kea-growth-ops/tests/sale-bulk-check.mjs
