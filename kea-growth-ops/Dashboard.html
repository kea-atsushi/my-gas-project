<!doctype html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f3ef;
        --surface: #ffffff;
        --ink: #141414;
        --muted: #6b6b66;
        --line: #deddd7;
        --accent: #174c3c;
        --warn: #a14b24;
        --radius: 18px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        line-height: 1.5;
      }
      .shell {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 20px 16px 64px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin: 12px 0 22px;
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(30px, 7vw, 54px);
        font-weight: 500;
        letter-spacing: -.03em;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }
      button, .sheet-link {
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        text-decoration: none;
        font-weight: 650;
      }
      button:hover, .sheet-link:hover {
        background: var(--ink);
        color: #fff;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .metric, .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .metric {
        min-height: 134px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .metric-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .06em;
      }
      .metric-value {
        margin-top: 18px;
        font-size: clamp(25px, 4vw, 40px);
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        letter-spacing: -.035em;
      }
      .metric-note {
        color: var(--muted);
        font-size: 11px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.15fr .85fr;
        gap: 12px;
        margin-top: 12px;
      }
      .health-stack {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .health-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        scroll-snap-align: start;
      }
      .health-panel h2 { margin: 0 0 16px; font-size: 20px; }
      .health-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .health-item {
        border: 1px solid var(--line);
        border-radius: 13px;
        min-height: 92px;
        padding: 12px;
      }
      .health-label { color: var(--muted); font-size: 11px; }
      .health-value {
        font-size: 18px;
        font-weight: 700;
        margin-top: 10px;
        overflow-wrap: anywhere;
      }
      .panel-wide { grid-column: 1 / -1; }
      .panel { padding: 20px; overflow: hidden; }
      .panel h2 { margin: 0 0 16px; font-size: 18px; }
      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
      }
      th { color: var(--muted); font-size: 11px; }
      td.num, th.num { text-align: right; }
      .rec-list { display: grid; gap: 9px; }
      .rec {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 13px;
      }
      .rec-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }
      .badge {
        border-radius: 999px;
        background: #e9eee9;
        color: var(--accent);
        display: inline-block;
        font-size: 10px;
        font-weight: 750;
        padding: 3px 8px;
      }
      .badge.high { background: #f5e9e3; color: var(--warn); }
      .rec-target { font-weight: 700; margin: 8px 0 4px; }
      .rec-copy { color: #343431; font-size: 12px; }
      .empty, .error {
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
        padding: 24px;
        text-align: center;
      }
      .error { color: var(--warn); }
      .loading {
        min-height: 45vh;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      @media (max-width: 820px) {
        header { align-items: flex-start; flex-direction: column; }
        .actions { justify-content: flex-start; }
        .status { text-align: left; }
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .health-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 430px) {
        .shell { padding-inline: 10px; }
        .metrics { gap: 7px; }
        .metric { min-height: 118px; padding: 14px; }
        .panel { padding: 16px; }
        .health-stack { scroll-snap-type: y proximity; }
        .health-panel {
          min-height: calc(100svh - 20px);
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">KEA. GROWTH OPS</p>
          <h1>Daily Pulse</h1>
        </div>
        <div>
          <div class="actions">
            <button type="button" onclick="loadDashboard()">更新</button>
            <a id="sheetLink" class="sheet-link" href="#" hidden>詳細シート</a>
          </div>
          <div id="status" class="status">取得中</div>
        </div>
      </header>
      <div id="content" class="loading">データを読み込んでいます…</div>
    </main>
    <script>
      const money = new Intl.NumberFormat('ja-JP', {
        style: 'currency',
        currency: 'JPY',
        maximumFractionDigits: 0,
      });
      const number = new Intl.NumberFormat('ja-JP', {
        maximumFractionDigits: 2,
      });

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function metric(label, value, note) {
        return `
          <article class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
            <div class="metric-note">${escapeHtml(note || '')}</div>
          </article>`;
      }

      function healthItem(label, value) {
        const display = value === '' || value == null ? '未取得' : value;
        return `<div class="health-item">
          <div class="health-label">${escapeHtml(label)}</div>
          <div class="health-value">${escapeHtml(display)}</div>
        </div>`;
      }

      function parseJson(value, fallback) {
        try { return value ? JSON.parse(value) : fallback; }
        catch (error) { return fallback; }
      }

      function booleanLabel(value) {
        if (value === true || value === 'TRUE') return '一致';
        if (value === false || value === 'FALSE') return '要確認';
        return '未取得';
      }

      function render(data) {
        const m = data.metrics || {};
        const health = data.health || {};
        const shopifySkuHealth = health.shopifySku || {};
        const merchantHealth = health.merchant || {};
        const seoHealth = health.seo || {};
        const meoHealth = health.meo || {};
        const productRows = data.products || [];
        const profit = m.contributionProfit === '' || m.contributionProfit == null
          ? '原価未設定'
          : money.format(Number(m.contributionProfit));
        const metrics = [
          metric('売上', money.format(Number(m.shopifySales || 0)), m.date || ''),
          metric('貢献利益', profit, '売上 − 原価 − 広告費'),
          metric('ROAS', number.format(Number(m.roas || 0)), 'Google Ads'),
          metric('CPA', money.format(Number(m.cpa || 0)), `CV ${number.format(Number(m.cv || 0))}`),
          metric('広告費', money.format(Number(m.adCost || 0)), `CPC ${money.format(Number(m.cpc || 0))}`),
          metric('CTR', `${(Number(m.ctr || 0) * 100).toFixed(1)}%`, 'Google Ads'),
          metric('SEOクリック', number.format(Number(m.gscClicks || 0)), `平均順位 ${number.format(Number(m.gscPosition || 0))}`),
          metric('Merchant承認', number.format(Number(m.merchantApproved || 0)), `不承認 ${number.format(Number(m.merchantDisapproved || 0))}`),
        ].join('');
        const products = productRows.length
          ? `<div class="table-wrap"><table>
              <thead><tr><th>商品</th><th>ブランド</th><th class="num">数量</th><th class="num">売上</th></tr></thead>
              <tbody>${productRows.map(product => `
                <tr>
                  <td>${escapeHtml(product.title)}</td>
                  <td>${escapeHtml(product.vendor)}</td>
                  <td class="num">${number.format(Number(product.units || 0))}</td>
                  <td class="num">${money.format(Number(product.revenue || 0))}</td>
                </tr>`).join('')}</tbody>
            </table></div>`
          : '<div class="empty">商品データはまだありません。</div>';
        const brandRows = Object.values(productRows.reduce((brands, product) => {
          const brand = String(product.vendor || '未設定').trim() || '未設定';
          if (!brands[brand]) {
            brands[brand] = { brand, units: 0, revenue: 0 };
          }
          brands[brand].units += Number(product.units || 0);
          brands[brand].revenue += Number(product.revenue || 0);
          return brands;
        }, {}))
          .sort((a, b) => b.revenue - a.revenue || b.units - a.units)
          .slice(0, 10);
        const brands = brandRows.length
          ? `<div class="table-wrap"><table>
              <thead><tr><th>ブランド</th><th class="num">数量</th><th class="num">売上</th></tr></thead>
              <tbody>${brandRows.map(brand => `
                <tr>
                  <td>${escapeHtml(brand.brand)}</td>
                  <td class="num">${number.format(brand.units)}</td>
                  <td class="num">${money.format(brand.revenue)}</td>
                </tr>`).join('')}</tbody>
            </table></div>`
          : '<div class="empty">ブランドデータはまだありません。</div>';
        const recommendations = (data.recommendations || []).length
          ? `<div class="rec-list">${data.recommendations.map(item => `
              <article class="rec">
                <div class="rec-top">
                  <span class="badge ${item.priority === '高' || item.priority === '最優先' ? 'high' : ''}">${escapeHtml(item.category)}</span>
                  <small>${escapeHtml(item.approvalStatus)}</small>
                </div>
                <div class="rec-target">${escapeHtml(item.target)}</div>
                <div class="rec-copy">${escapeHtml(item.recommendation)}</div>
              </article>`).join('')}</div>`
          : '<div class="empty">改善候補はまだありません。</div>';
        const majorUrls = parseJson(seoHealth.majorUrlSummary, []);
        const indexedUrls = majorUrls.filter(item => item.indexed === true).length;
        const shopifySkuPanel = `
          <article class="health-panel">
            <h2>Shopify SKU監査</h2>
            <div class="health-grid">
              ${healthItem('対象商品', shopifySkuHealth.productCount)}
              ${healthItem('バリエーション', shopifySkuHealth.variantCount)}
              ${healthItem('要確認', shopifySkuHealth.issueVariantCount)}
              ${healthItem('SKU空欄', shopifySkuHealth.skuBlankCount)}
              ${healthItem('形式違反', shopifySkuHealth.skuFormatCount)}
              ${healthItem('重複SKU', shopifySkuHealth.duplicateSkuCount)}
              ${healthItem('重複商品コード', shopifySkuHealth.duplicateProductCodeCount)}
              ${healthItem('期待ブランド不一致', shopifySkuHealth.expectedVendorMismatchCount)}
              ${healthItem('商品コード欠落', shopifySkuHealth.productCodeMissingCount)}
              ${healthItem('option異常', shopifySkuHealth.optionIssueCount)}
            </div>
          </article>`;
        const merchantPanel = `
          <article class="health-panel">
            <h2>Merchant</h2>
            <div class="health-grid">
              ${healthItem('商品総数', merchantHealth.totalProducts)}
              ${healthItem('承認済み', merchantHealth.approved)}
              ${healthItem('審査中', merchantHealth.pending)}
              ${healthItem('不承認', merchantHealth.disapproved)}
              ${healthItem('制限付き', merchantHealth.limited)}
              ${healthItem('前回からの変化', merchantHealth.changeSummary)}
              ${healthItem('上位issue', merchantHealth.topIssueCodes)}
              ${healthItem('同期状態', merchantHealth.syncStatus)}
            </div>
          </article>`;
        const seoPanel = `
          <article class="health-panel">
            <h2>SEO</h2>
            <div class="health-grid">
              ${healthItem('クリック', seoHealth.clicks)}
              ${healthItem('表示', seoHealth.impressions)}
              ${healthItem('CTR', seoHealth.ctr === '' || seoHealth.ctr == null ? '' : `${(Number(seoHealth.ctr) * 100).toFixed(1)}%`)}
              ${healthItem('平均順位', seoHealth.position === '' ? '' : number.format(Number(seoHealth.position || 0)))}
              ${healthItem('前期間比', seoHealth.clickChangePct === '' || seoHealth.clickChangePct == null ? '' : `${(Number(seoHealth.clickChangePct) * 100).toFixed(1)}%`)}
              ${healthItem('sitemap', `エラー ${seoHealth.sitemapErrors === '' ? '未取得' : seoHealth.sitemapErrors} / 待ち ${seoHealth.sitemapPending === '' ? '未取得' : seoHealth.sitemapPending}`)}
              ${healthItem('主要URL登録', majorUrls.length ? `${indexedUrls}/${majorUrls.length}` : '')}
              ${healthItem('旧URL残存', seoHealth.oldUrlCount)}
            </div>
          </article>`;
        const meoPanel = `
          <article class="health-panel">
            <h2>MEO</h2>
            <div class="health-grid">
              ${healthItem('API接続', meoHealth.connectionStatus)}
              ${healthItem('店舗情報', booleanLabel(meoHealth.businessInfoMatches))}
              ${healthItem('営業時間', booleanLabel(meoHealth.hoursMatch))}
              ${healthItem('WebサイトURL', booleanLabel(meoHealth.websiteMatches))}
              ${healthItem('口コミ数', meoHealth.reviewCount)}
              ${healthItem('口コミ監視', meoHealth.reviewsStatus)}
              ${healthItem('平均評価', meoHealth.averageRating)}
              ${healthItem('未返信口コミ', meoHealth.unansweredReviews)}
              ${healthItem('GBP Performance', meoHealth.performanceStatus)}
              ${healthItem('GBP表示（7日）', meoHealth.performanceImpressions)}
              ${healthItem('Webクリック（7日）', meoHealth.performanceWebsiteClicks)}
              ${healthItem('電話クリック（7日）', meoHealth.performanceCallClicks)}
              ${healthItem('ルート検索（7日）', meoHealth.performanceDirectionRequests)}
              ${healthItem('ローカル在庫リンク', meoHealth.localInventoryLinkStatus)}
            </div>
          </article>`;
        document.getElementById('content').className = '';
        document.getElementById('content').innerHTML = `
          <section class="metrics">${metrics}</section>
          <section class="health-stack">
            ${shopifySkuPanel}${merchantPanel}${seoPanel}${meoPanel}
          </section>
          <section class="grid">
            <article class="panel"><h2>人気商品</h2>${products}</article>
            <article class="panel"><h2>人気ブランド</h2>${brands}</article>
            <article class="panel panel-wide"><h2>承認待ち</h2>${recommendations}</article>
          </section>`;
        document.getElementById('status').textContent =
          `最終取得 ${data.generatedAt || '—'} / ${m.status || '—'}`;
        const link = document.getElementById('sheetLink');
        if (data.spreadsheetUrl) {
          link.href = data.spreadsheetUrl;
          link.hidden = false;
        }
      }

      function showError(error) {
        document.getElementById('content').className = 'error';
        document.getElementById('content').textContent =
          error && error.message
            ? error.message
            : String(error || '取得に失敗しました。');
        document.getElementById('status').textContent = '取得エラー';
      }

      function loadDashboard() {
        document.getElementById('status').textContent = '取得中';
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getDashboardData();
      }

      loadDashboard();
    </script>
  </body>
</html>
